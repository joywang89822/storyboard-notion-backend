<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>參考素材資料庫</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --warn:#a35a00; --warn-soft:#fdf0dc;
  --ok:#2c7a4b; --ok-soft:#e3f3e9; --chip:#efefeb; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9a9a93; --line:#33332f;
    --accent:#86a5ff; --accent-soft:#232c45; --warn:#f0b35b; --warn-soft:#3a2c17;
    --ok:#7fd1a0; --ok-soft:#1b3326; --chip:#2a2a27; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9a9a93; --line:#33332f;
  --accent:#86a5ff; --accent-soft:#232c45; --warn:#f0b35b; --warn-soft:#3a2c17;
  --ok:#7fd1a0; --ok-soft:#1b3326; --chip:#2a2a27; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 10px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0;font-weight:700;white-space:nowrap}
#q{flex:1;min-width:220px;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
select,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.expand{color:var(--muted);font-size:12px;margin-top:6px;min-height:18px}
.expand b{color:var(--accent);font-weight:600}
main{padding:16px 20px 60px}
.group{margin-bottom:26px}
.group h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
.group h2 span{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/10;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subj{font-weight:700;font-size:14px}
.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.ai{background:var(--warn-soft);color:var(--warn)}
.badge.todo{background:var(--accent-soft);color:var(--accent)}
.desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--ink)}
.tag.hit{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
dialog{border:none;border-radius:12px;padding:0;max-width:min(1200px,96vw);width:96vw;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.dlg .big{background:#000;display:flex;align-items:center;justify-content:center;max-height:86vh}
.dlg .big img{max-width:100%;max-height:86vh;object-fit:contain}
.info{padding:16px 18px;overflow:auto;max-height:86vh}
.info h3{margin:0 0 4px;font-size:17px}
.info .fn{color:var(--muted);font-size:12px;word-break:break-all;margin-bottom:12px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.close{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#c0392b}
button.link{border:none;background:none;color:var(--accent);text-decoration:underline;padding:0 6px}
.editbadge{font-size:11px;font-weight:600;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--warn-soft);color:var(--warn);vertical-align:middle}
.ed{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ed label{display:flex;flex-direction:column;gap:3px;min-width:0}
.ed label>span{color:var(--muted);font-size:12px}
.ed input,.ed select,.ed textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.ed label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--warn)}
.ed label.chk input{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.newtag{display:flex;flex-direction:column;gap:6px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.meta2{font-size:12px;color:var(--muted);word-break:break-all}
.edbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.msg{font-size:12.5px;color:var(--ok)}
#sug{max-width:min(980px,96vw)}
.sugwrap{padding:18px 20px;max-height:86vh;overflow:auto}
.sugwrap h3{margin:0 0 6px}
.sugwrap ul{margin:6px 0 14px;padding-left:18px}
.sugrow{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.sugthumbs{display:flex;gap:4px}
.sugthumbs img{width:84px;height:52px;object-fit:cover;border-radius:4px;cursor:pointer;background:var(--chip)}
.sugmain{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
.sugact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sugact input,.sugact select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);flex:1;min-width:160px}
@media (max-width:760px){
  header{padding:12px 16px 8px} main{padding:12px 16px 40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .dlg{grid-template-columns:1fr} .count{margin-left:0;width:100%}
}
</style>
</head>

<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="sug"></dialog>

  img.dataset.retry = n+1;
  const base = img.src.split("?")[0];
  setTimeout(()=>{ img.src = base + "?r=" + (n+1); }, 400*(n+1));
}, true);
const FILTERS = [["game","遊戲"],["asset_type","類型"],["style","風格"],["視角","視角"],["鏡位","鏡位"],["tag_source","標記來源"]];
const state = {q:"", f:{}, group:"campaign"};

// 同義詞 → 標準 tag
const SYN = [];
for (const k of DATA.keywords){ SYN.push([k.tag.toLowerCase(), k.tag]); for (const s of k.synonyms) SYN.push([s.toLowerCase(), k.tag]); }

const items = DATA.items.map((it,i)=>{
  it._i = i;
  it._tags = (it.tags||"").split("、").map(s=>s.trim()).filter(Boolean);
  it._hay = [it.subject,it.asset_type,it.game,it.style,it["視角"],it["呈現形式"],it["鏡位"],it["牌面"],it.character,it.tags,it.description,it["畫面文字"],it.campaign,it.note,it.file_name].join(" ").toLowerCase();
  return it;
});

function expandTerm(t){
  const out = new Set([t]);
  for (const [s,tag] of SYN){ if (s===t || (t.length>=2 && s.includes(t))) out.add(tag.toLowerCase()); }
  return [...out];
}
function parseQuery(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean).map(t=>({t, alts:expandTerm(t)})); }

function filtered(){
  const terms = parseQuery(state.q);
  return items.filter(it=>{
    for (const [k,v] of Object.entries(state.f)) if (v && (it[k]||"") !== v) return false;
    return terms.every(({alts})=>alts.some(a=>it._hay.includes(a)));
  });
}

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){ if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for (const k of kids) if (k!=null) e.append(k);
  return e;
}

function buildFilters(){
  const box = document.getElementById("filters");
  for (const [k,label] of FILTERS){
    const opts = DATA.options[k] || [];
    const present = new Set(items.map(i=>i[k]).filter(Boolean));
    const all = [...opts.filter(o=>present.has(o)), ...[...present].filter(o=>!opts.includes(o))];
    if (!all.length) continue;
    const s = el("select",{"aria-label":label}, el("option",{value:""},`${label}：全部`), ...all.map(o=>el("option",{value:o},`${label}：${o}`)));
    s.addEventListener("change",()=>{ state.f[k]=s.value; render(); });
    box.append(s);
  }
  const g = el("select",{"aria-label":"分組"},
    el("option",{value:"campaign"},"依篇名分組"), el("option",{value:"subject"},"依 subject 分組"),
    el("option",{value:"asset_type"},"依類型分組"), el("option",{value:""},"不分組"));
  g.addEventListener("change",()=>{ state.group=g.value; render(); });
  box.append(g, el("button",{onclick:()=>{ state.f={}; state.q=""; document.getElementById("q").value=""; box.querySelectorAll("select").forEach((s,i,a)=>{ s.value = i===a.length-1 ? state.group : ""; }); render(); }},"清除"));
  box.append(el("span",{class:"count",id:"count"}));
}

function card(it, hitSet){
  const subj = it.subject || (it.note.startsWith("AI建議新tag") ? it.note.replace("AI建議新tag：","＋") : "（未分類）");
  const src = it.tag_source==="AI待確認" ? el("span",{class:"badge ai"},"AI待確認") : it.tag_source==="待標記" ? el("span",{class:"badge todo"},"待標記") : null;
  return el("div",{class:"card",onclick:()=>openDlg(it._i)},
    el("div",{class:"thumb"}, el("img",{src:it.thumb,loading:"lazy",alt:it.description||it.file_name})),
    el("div",{class:"meta"},
      el("div",{class:"row1"}, el("span",{class:"subj"},subj), it.asset_type?el("span",{class:"badge"},it.asset_type):null, it.style?el("span",{class:"badge"},it.style):null, it["視角"]&&it["視角"]!=="不指定"?el("span",{class:"badge"},it["視角"]):null, src),
      it.description?el("div",{class:"desc"},it.description):null,
      el("div",{class:"tags"}, ...it._tags.slice(0,8).map(t=>el("span",{class:"tag"+(hitSet(t)?" hit":"")},t)))
    ));
}

let current = [];
function render(){
  const list = filtered(); current = list;
  document.getElementById("count").textContent = `${list.length} / ${items.length} 張`;
  const terms = parseQuery(state.q);
  const syns = terms.flatMap(({t,alts})=>alts.filter(a=>a!==t).map(a=>`「${t}」→ <b>${a}</b>`));
  document.getElementById("expand").innerHTML = syns.length ? "同義詞展開：" + syns.join("、") : "";
  const hitSet = t => { const lt=t.toLowerCase(); return terms.some(({alts})=>alts.some(a=>lt.includes(a))); };
  const main = document.getElementById("main"); main.innerHTML = "";
  if (!list.length){ main.append(el("div",{class:"empty"},"沒有符合的素材。試試更短的關鍵字，或清除篩選。")); return; }
  const groups = new Map();
  for (const it of list){ const k = state.group ? (it[state.group]||"（未填）") : ""; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it); }
  for (const [k,arr] of groups){
    const g = el("section",{class:"group"});
    if (state.group) g.append(el("h2",{}, el("span",{},k), `　${arr.length} 張`));
    g.append(el("div",{class:"grid"}, ...arr.map(it=>card(it,hitSet))));
    main.append(g);
  }
}

function openDlg(i){
  const it = items[i]; const d = document.getElementById("dlg"); d.innerHTML = "";
  const kv = [["subject",it.subject],["類型",it.asset_type],["呈現形式",it["呈現形式"]],["視角",it["視角"]],["鏡位",it["鏡位"]],["牌面",it["牌面"]],["風格",it.style],["遊戲",it.game],["角色",it.character],
              ["tags",it.tags],["描述",it.description],["畫面文字",it["畫面文字"]],["note",it.note],["篇名",it.campaign],["時間點",it.timecode?it.timecode+" 秒":""],["來源影片",it.source_video],["標記來源",it.tag_source]];
  const idx = current.findIndex(x=>x._i===i);
  const go = n => { const nx = current[idx+n]; if (nx) openDlg(nx._i); };
  d.append(el("div",{class:"dlg"},
    el("div",{class:"big"}, el("img",{src:it.file_path,alt:it.description||it.file_name})),
    el("div",{class:"info"},
      el("h3",{},it.subject||"（未分類）"), el("div",{class:"fn"},it.file_path),
      DATA.editable ? editor(it, ()=>go(1)) : el("dl",{class:"kv"}, ...kv.filter(([,v])=>v).flatMap(([k,v])=>[el("dt",{},k), el("dd",{},v)])),
      el("div",{class:"nav"},
        el("button",{onclick:()=>go(-1)},"← 上一張"), el("button",{onclick:()=>go(1)},"下一張 →"),
        el("button",{onclick:e=>{ navigator.clipboard.writeText(it.file_path); e.target.textContent="已複製路徑"; }},"複製路徑"),
        el("button",{onclick:()=>window.open(it.file_path,"_blank")},"開原圖")))),
    el("button",{class:"close",onclick:()=>d.close(),"aria-label":"關閉"},"×"));
  if (!d.open) d.showModal();
}
// ---------- 編輯模式（只有用 gallery_server.py 開啟時才有）----------
const TAGSET = () => new Set(DATA.keywords.map(k=>k.tag));
async function api(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({ok:false,error:"伺服器沒有回應"}));
  if (!r.ok || !j.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function refreshItem(it, row){
  Object.assign(it,row);
  it._tags=(it.tags||"").split("、").map(s=>s.trim()).filter(Boolean);
  it._hay=[it.subject,it.asset_type,it.game,it.style,it["視角"],it["呈現形式"],it["鏡位"],it["牌面"],it.character,it.tags,it.description,it["畫面文字"],it.campaign,it.note,it.file_name].join(" ").toLowerCase();
}
function sel(name,val,opts,blank){
  return el("select",{name}, ...(blank?[el("option",{value:""},"（空）")]:[]), ...opts.map(o=>{const op=el("option",{value:o},o); if(o===val) op.selected=true; return op;}));
}
function editor(it, goNext){
  const f = el("form",{class:"ed",onsubmit:e=>e.preventDefault()});
  const dl = el("datalist",{id:"taglist"}, ...DATA.keywords.map(k=>el("option",{value:k.tag})));
  const field=(label,input,hint)=>el("label",{}, el("span",{},label), input, hint||null);
  const subj = el("input",{name:"subject",value:it.subject||"",list:"taglist",placeholder:"從對照表選，或打新的"});
  const sug = suggestionOf(it);
  const newBox = el("div",{class:"newtag"});
  const updNew=()=>{ const v=subj.value.trim(); newBox.innerHTML="";
    if(v && !TAGSET().has(v)) newBox.append(el("label",{class:"chk"}, el("input",{type:"checkbox",name:"add_keyword",checked:""}), `「${v}」不在對照表，存檔時一併新增`),
      el("input",{name:"synonyms",placeholder:"同義詞（腳本裡可能的寫法，用、分隔，可留空）"})); };
  subj.addEventListener("input",updNew); updNew();
  f.append(dl,
    sug ? el("div",{class:"hint"},`AI 建議的新 tag：「${sug}」— 可直接把它填進 subject，或到「新tag建議」面板整批處理`) : null,
    field("subject",subj), newBox,
    el("div",{class:"row2"}, field("類型",sel("asset_type",it.asset_type,DATA.options.asset_type,true)), field("呈現形式",sel("呈現形式",it["呈現形式"],DATA.options["呈現形式"],true))),
    el("div",{class:"row2"}, field("視角",sel("視角",it["視角"],DATA.options["視角"],true)), field("鏡位",sel("鏡位",it["鏡位"],DATA.options["鏡位"],true))),
    el("div",{class:"row2"}, field("風格",sel("style",it.style,DATA.options.style,true)), field("牌面",el("input",{name:"牌面",value:it["牌面"]||"",placeholder:"AA、KKK…"}))),
    field("tags",el("input",{name:"tags",value:it.tags||"",placeholder:"用、分隔"})),
    field("描述",el("input",{name:"description",value:it.description||""})),
    field("畫面文字",el("textarea",{name:"畫面文字",rows:"2"},it["畫面文字"]||"")),
    field("note",el("input",{name:"note",value:it.note||""})),
    el("div",{class:"meta2"}, `篇名：${it.campaign||"-"}`, it.timecode?`　｜　${it.timecode} 秒`:"", `　｜　標記來源：${it.tag_source}`));
  const msg = el("span",{class:"msg"});
  const save = async (confirm, next)=>{
    const fd = new FormData(f); const fields = {};
    for (const k of ["subject","asset_type","呈現形式","視角","鏡位","style","牌面","tags","description","畫面文字","note"]) fields[k]=(fd.get(k)||"").toString().trim();
    msg.textContent="儲存中…";
    try{
      const j = await api("/api/save",{file_path:it.file_path, fields, confirm, add_keyword:!!fd.get("add_keyword"), synonyms:(fd.get("synonyms")||"").toString()});
      refreshItem(it,j.row); if (j.keywords) DATA.keywords=j.keywords;
      msg.textContent = confirm ? "已儲存並確認 ✓" : "已儲存 ✓"; render();
      if (next) goNext();
    }catch(e){ msg.textContent="失敗："+e.message; }
  };
  f.append(el("div",{class:"edbtns"},
    el("button",{type:"button",class:"primary",onclick:()=>save(true,true)},"確認並下一張"),
    el("button",{type:"button",onclick:()=>save(true,false)},"確認（標為人工）"),
    el("button",{type:"button",onclick:()=>save(false,false)},"只儲存"),
    el("button",{type:"button",class:"danger",onclick:async()=>{
      if(!confirm("把這張移出資料庫？（圖會搬到 _已移除 資料夾，不會刪檔）")) return;
      try{ await api("/api/remove",{file_path:it.file_path}); items.splice(items.indexOf(it),1); items.forEach((x,i)=>x._i=i); goNext(); render(); }catch(e){ msg.textContent="失敗："+e.message; }
    }},"移除這張"), msg));
  return f;
}
const SUG_PREFIX="AI建議新tag：";
function suggestionOf(it){ const n=it.note||""; return n.startsWith(SUG_PREFIX) ? n.slice(SUG_PREFIX.length).trim() : ""; }

function openSuggest(){
  const d=document.getElementById("sug"); d.innerHTML="";
  const groups=new Map();
  for(const it of items){ const s=suggestionOf(it); if(!s) continue; if(!groups.has(s)) groups.set(s,[]); groups.get(s).push(it); }
  const list=[...groups].sort((a,b)=>b[1].length-a[1].length);
  const tagOpts=DATA.keywords.map(k=>k.tag);
  const body=el("div",{class:"sugwrap"},
    el("h3",{},`新 tag 建議（${list.length} 種）`),
    el("p",{class:"hint"},"這些是畫面內容不在關鍵字對照表裡的圖，subject 目前空白，所以產腳本時自動選圖選不到。每一種選一個處理方式："),
    el("ul",{class:"hint"},
      el("li",{},"「加入對照表」：變成新的標準 tag，這批圖的 subject 會自動填上，之後腳本提到同義詞就會選到"),
      el("li",{},"「併入」：其實就是某個既有 tag（例如『荷官』併入『玩家特寫』），這批圖 subject 改填那個 tag"),
      el("li",{},"「不需要」：這類畫面不會拿來當參考，清掉建議；圖仍保留、網頁仍搜得到")));
  if(!list.length) body.append(el("p",{},"目前沒有待處理的建議 🎉"));
  for(const [s,arr] of list){
    const syn=el("input",{placeholder:"同義詞，用、分隔（可留空）",value:s});
    const merge=sel("merge","",tagOpts,true);
    const status=el("span",{class:"msg"});
    const act=async(action)=>{
      const target = action==="merge" ? merge.value : s;
      if(action==="merge" && !target){ status.textContent="先選要併入哪個 tag"; return; }
      status.textContent="處理中…";
      try{ const j=await api("/api/suggestion",{suggestion:s,action,target,synonyms:syn.value});
        for(const row of j.rows){ const it=items.find(x=>x.file_path===row.file_path); if(it) refreshItem(it,row); }
        if(j.keywords) DATA.keywords=j.keywords;
        render(); openSuggest(); updSugBtn();
      }catch(e){ status.textContent="失敗："+e.message; }
    };
    body.append(el("div",{class:"sugrow"},
      el("div",{class:"sugthumbs"}, ...arr.slice(0,4).map(it=>el("img",{src:it.thumb,loading:"lazy",title:it.description,onclick:()=>{d.close();openDlg(it._i);}}))),
      el("div",{class:"sugmain"},
        el("div",{}, el("b",{},s), `　${arr.length} 張`, el("button",{type:"button",class:"link",onclick:()=>{d.close(); state.q=s; document.getElementById("q").value=s; render();}},"看全部")),
        el("div",{class:"sugact"}, syn, el("button",{type:"button",class:"primary",onclick:()=>act("add")},"加入對照表")),
        el("div",{class:"sugact"}, merge, el("button",{type:"button",onclick:()=>act("merge")},"併入"), el("button",{type:"button",class:"danger",onclick:()=>act("ignore")},"不需要"), status))));
  }
  d.append(body, el("button",{class:"close",onclick:()=>d.close(),"aria-label":"關閉"},"×"));
  if(!d.open) d.showModal();
}
function updSugBtn(){ const b=document.getElementById("sugbtn"); if(!b) return; const n=new Set(items.map(suggestionOf).filter(Boolean)).size; b.textContent=`新tag建議（${n}）`; }
if (DATA.editable){
  const b=el("button",{id:"sugbtn",class:"primary",onclick:openSuggest},"新tag建議");
  document.querySelector(".top").insertBefore(b, document.getElementById("theme"));
  document.querySelector("h1").append(el("span",{class:"editbadge"},"編輯模式"));
  updSugBtn();
}
document.getElementById("sug").addEventListener("click",e=>{ if(e.target.id==="sug") e.target.close(); });

document.addEventListener("keydown",e=>{
  const d=document.getElementById("dlg"); if(!d.open) return;
  if (["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  const btns=d.querySelectorAll(".nav button");
  if(e.key==="ArrowLeft") btns[0].click(); if(e.key==="ArrowRight") btns[1].click();
});
document.getElementById("dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") e.target.close(); });

let tm; document.getElementById("q").addEventListener("input",e=>{ clearTimeout(tm); tm=setTimeout(()=>{ state.q=e.target.value; render(); },120); });
document.getElementById("theme").addEventListener("click",()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try{ localStorage.setItem("theme", r.dataset.theme); }catch(e){}
});
try{ const t=localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
buildFilters(); render();
</script>
